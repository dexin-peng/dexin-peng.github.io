<svg xmlns="http://www.w3.org/2000/svg" class="research-animation ranking-animation" width="960" height="436" viewBox="0 0 960 436" role="img" aria-labelledby="svg-ranking-animation--ranking-animation-title" id="svg-ranking-animation" data-svg-controls="1">
<style data-svg-controls="1">#svg-ranking-animation .svg-label{transform:scale(var(--font-scale,1));transform-box:fill-box;transform-origin:center;}</style><title id="svg-ranking-animation--ranking-animation-title">Preservation and Refinement</title>
<style>#svg-ranking-animation{ color: var(--standard-characters, #203448); font-family: "CMU Serif", "Times New Roman", Times, serif; }
#svg-ranking-animation text{ fill: currentColor; }
#svg-ranking-animation .blue{ color: var(--diagram-blue, #2a63a4); }
#svg-ranking-animation .green{ color: var(--diagram-green, #148777); }
#svg-ranking-animation .orange{ color: var(--diagram-orange, #c9712f); }
#svg-ranking-animation .muted{ color: var(--diagram-muted, #657485); }
#svg-ranking-animation .axis{ stroke: var(--line, #dce3ea); stroke-width: 1; }
#svg-ranking-animation .flow{ fill: none; stroke: currentColor; stroke-width: 1.35; stroke-linecap: square; stroke-linejoin: miter; }
#svg-ranking-animation .card{ fill: none; stroke: currentColor; stroke-width: 1.2; }
#svg-ranking-animation .frame{ fill: none; stroke: var(--line, #dce3ea); stroke-width: 1.4; }
#svg-ranking-animation .signal{ fill: currentColor; stroke: none; }
#svg-ranking-animation,#svg-ranking-animation text,#svg-ranking-animation path,#svg-ranking-animation rect,#svg-ranking-animation line,#svg-ranking-animation g{
  transition: color var(--theme-transition-duration, .382s) ease,
              fill var(--theme-transition-duration, .382s) ease,
              stroke var(--theme-transition-duration, .382s) ease;
}
#svg-ranking-animation .neutral{
  fill: var(--standard-characters, #203448);
  transition: fill var(--theme-transition-duration, .382s) ease;
}
#svg-ranking-animation .animation-static{ display: none; }
@media (prefers-reduced-motion: reduce){
#svg-ranking-animation .animation-motion{ display: none; }
#svg-ranking-animation .animation-static{ display: inline; }
}</style>
