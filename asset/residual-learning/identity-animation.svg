<svg xmlns="http://www.w3.org/2000/svg" class="research-animation identity-animation"
  width="960" height="494" viewBox="0 0 960 494"
  role="img" aria-labelledby="identity-animation-title">
<title id="identity-animation-title">Return Forecast</title>
<style>
.identity-animation { color: var(--standard-characters, #203448); font-family: "CMU Serif", "Times New Roman", Times, serif; }
.identity-animation text { fill: currentColor; }
.identity-animation .blue { color: var(--diagram-blue, #2a63a4); }
.identity-animation .green { color: var(--diagram-green, #148777); }
.identity-animation .orange { color: var(--diagram-orange, #c9712f); }
.identity-animation .muted { color: var(--diagram-muted, #657485); }
.identity-animation .axis { stroke: var(--line, #dce3ea); stroke-width: 1; }
.identity-animation .flow { fill: none; stroke: currentColor; stroke-width: 1.35; stroke-linecap: square; stroke-linejoin: miter; }
.identity-animation .card { fill: none; stroke: currentColor; stroke-width: 1.2; }
.identity-animation .frame { fill: none; stroke: var(--line, #dce3ea); stroke-width: 1.4; }
.identity-animation .signal { fill: currentColor; stroke: none; }
.identity-animation, .identity-animation text, .identity-animation path, .identity-animation rect, .identity-animation line, .identity-animation g {
  transition: color var(--theme-transition-duration, .382s) ease,
              fill var(--theme-transition-duration, .382s) ease,
              stroke var(--theme-transition-duration, .382s) ease;
}
.identity-animation .animation-static { display: none; }
@media (prefers-reduced-motion: reduce) {
  .identity-animation .animation-motion { display: none; }
  .identity-animation .animation-static { display: inline; }
}
</style>
